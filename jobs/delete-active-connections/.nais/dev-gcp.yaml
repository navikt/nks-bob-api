apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: nks-bob-api-delete-active-connections
  namespace: nks-aiautomatisering
  labels:
    team: nks-aiautomatisering
spec:
  image: "{{ image }}"
  schedule: "15 3 * * *"
  timeZone: Europe/Oslo
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
    limits:
      memory: 512Mi
  accessPolicy:
    outbound:
      rules:
        - application: nks-bob-api
  azure:
    application:
      tenant: nav.no
      enabled: true
  env:
    - name: NKS_BOB_API_URL
      value: http://nks-bob-api
    - name: NKS_BOB_API_SCOPE
      value: api://dev-gcp.nks-aiautomatisering.nks-bob-api/.default
  observability:
    logging:
      destinations:
        - id: loki
